services:
  chain-a:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil"]
    command: ["--host", "0.0.0.0", "--port", "8545"]
    ports:
      - "8545:8545"

  chain-b:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil"]
    command: ["--host", "0.0.0.0", "--port", "9545"]
    ports:
      - "9545:9545"

  relayer:
    build: ./relayer
    env_file:
      - .env
    depends_on:
      - chain-a
      - chain-b
